[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-method-builder"
version = "0.1.0"
description = "desktop editor for cycling protocols and palmsens methodscript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "aurora-unicycler @ git+https://github.com/ahallgrenkemi/aurora-unicycler.git@b5cbaa96a49a62d9189fec766ce3839da6d2cf3e",
]

[project.gui-scripts]
aurora-method-builder = "aurora_method_builder.app:main"

[tool.setuptools.packages.find]
where = ["src"]
